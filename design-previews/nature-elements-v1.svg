<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">BurpeeJump 晨光自然小徑 SVG 元素樣張</title>
  <desc id="description">柔和幾何風格的太陽、草地、葉子、石頭、小花，以及元素組成的自然小徑場景。</desc>

  <rect width="1200" height="900" rx="36" fill="#FAF9F6"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#1E293B">
    <text x="72" y="82" font-size="32" font-weight="700">晨光自然小徑</text>
    <text x="72" y="116" font-size="17" fill="#64748B">SVG 元素樣張 v1 · 柔和幾何輪廓，保留自然物件的辨識度</text>
  </g>

  <path d="M72 150H1128" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

  <!-- Sun -->
  <g transform="translate(158 230)">
    <g stroke="#D8AE4B" stroke-width="9" stroke-linecap="round">
      <path d="M0 -82V-112"/>
      <path d="M0 82V112"/>
      <path d="M82 0H112"/>
      <path d="M-82 0H-112"/>
      <path d="M58 -58L79 -79"/>
      <path d="M58 58L79 79"/>
      <path d="M-58 58L-79 79"/>
      <path d="M-58 -58L-79 -79"/>
    </g>
    <circle r="65" fill="#F1D997"/>
    <path d="M-30 -17C-11 -37 24 -34 39 -9" fill="none" stroke="#F7E9B8" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="158" y="389" text-anchor="middle" font-size="21" font-weight="650" fill="#1E293B">太陽</text>
    <text x="158" y="418" text-anchor="middle" font-size="15" fill="#64748B">圓潤短光芒，像晨光而非狀態圖示</text>
  </g>

  <!-- Grass -->
  <g transform="translate(395 203)">
    <path d="M-126 106C-93 62 -54 74 -17 51C25 25 74 42 128 97V139H-126Z" fill="#BFCDB6"/>
    <path d="M-126 125C-76 82 -39 111 4 78C48 46 91 75 128 108V139H-126Z" fill="#91A587"/>
    <g fill="none" stroke="#718669" stroke-width="8" stroke-linecap="round">
      <path d="M-88 113C-91 85 -99 72 -111 58"/>
      <path d="M-88 113C-78 86 -70 74 -55 62"/>
      <path d="M-88 113C-85 81 -82 64 -80 47"/>
      <path d="M68 101C63 72 54 59 42 46"/>
      <path d="M68 101C76 72 86 58 101 46"/>
      <path d="M68 101C69 68 69 53 72 35"/>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="395" y="389" text-anchor="middle" font-size="21" font-weight="650" fill="#1E293B">草地</text>
    <text x="395" y="418" text-anchor="middle" font-size="15" fill="#64748B">連續地面＋草葉輪廓，形成地平線</text>
  </g>

  <!-- Leaves -->
  <g transform="translate(680 214)">
    <path d="M-78 111C-47 69 -14 28 70 -44" fill="none" stroke="#64785F" stroke-width="10" stroke-linecap="round"/>
    <path d="M-35 65C-68 53 -80 27 -70 4C-39 3 -17 24 -16 51C-23 57 -29 61 -35 65Z" fill="#A8B99F"/>
    <path d="M2 25C4 -9 27 -32 58 -31C66 -4 50 24 17 37C12 32 7 28 2 25Z" fill="#7C9076"/>
    <path d="M35 -5C17 -31 22 -59 43 -76C68 -59 75 -33 59 -9C51 -8 43 -7 35 -5Z" fill="#B8C8B0"/>
    <path d="M-68 104C-92 82 -91 54 -73 35C-46 46 -34 69 -44 94C-52 98 -60 101 -68 104Z" fill="#7C9076"/>
