      <path d="M93 271C88 238 78 220 62 204"/><path d="M93 271C101 237 114 219 133 205"/><path d="M93 271C93 232 95 211 100 189"/>
      <path d="M861 245C858 215 849 198 834 184"/><path d="M861 245C870 211 883 196 901 183"/><path d="M861 245C863 208 865 190 871 169"/>
    </g>

    <g transform="translate(808 252) scale(.54)">
      <path d="M-126 73C-128 39 -102 13 -68 16C-38 19 -24 44 -32 73Z" fill="#B3ADA4"/>
      <path d="M-21 73C-23 25 9 -12 51 -6C89 -1 107 30 99 73Z" fill="#CEC7BB"/>
      <path d="M92 73C91 50 108 33 130 35C150 37 162 52 158 73Z" fill="#9C988F"/>
