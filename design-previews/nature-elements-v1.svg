      <ellipse cx="14" cy="1" rx="17" ry="10" fill="#E9A9A7"/>
      <ellipse cy="14" rx="10" ry="17" fill="#E9A9A7"/>
      <ellipse cx="-14" cy="1" rx="17" ry="10" fill="#E9A9A7"/>
      <circle cy="1" r="9" fill="#F1D997"/>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="968" y="389" text-anchor="middle" font-size="21" font-weight="650" fill="#1E293B">石頭與小花</text>
    <text x="968" y="418" text-anchor="middle" font-size="15" fill="#64748B">不規則輪廓和高光提供自然感與比例</text>
  </g>

  <path d="M72 466H1128" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/>

